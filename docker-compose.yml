services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: squirrelvault-backend:local
    container_name: squirrelvault-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: squirrelvault
      DB_USER: squirrelvault
      DB_PASSWORD: squirrelvault
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: squirrelvault-frontend:local
    container_name: squirrelvault-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: squirrelvault-postgres
    environment:
      POSTGRES_DB: squirrelvault
      POSTGRES_USER: squirrelvault
      POSTGRES_PASSWORD: squirrelvault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squirrelvault -d squirrelvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: squirrelvault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
