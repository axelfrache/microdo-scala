services:
  microdo:
    build:
      context: .
      dockerfile: Dockerfile
    image: microdo:local
    container_name: microdo
    ports:
      - "8080:8080"
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    container_name: squirrelvault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
